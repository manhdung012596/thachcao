<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#ECC731" />
      <stop offset="100%" stop-color="#D9A300" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC731" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Icon: Stylized Geometric Ceiling & Home Structure -->
  <g transform="translate(10, 10)">
    <!-- Outer diamond / roof layer -->
    <path d="M 25 0 L 50 15 L 25 30 L 0 15 Z" fill="url(#iconGrad)" filter="url(#glow)" />
    <!-- Secondary layer (stepped ceiling effect) -->
    <path d="M 25 10 L 42 20 L 25 30 L 8 20 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 25 18 L 35 24 L 25 30 L 15 24 Z" fill="url(#iconGrad)" />
    <!-- Vertical column accents -->
    <path d="M 0 15 L 0 38 L 25 52 L 25 30 Z" fill="#C67D00" opacity="0.85" />
    <path d="M 50 15 L 50 38 L 25 52 L 25 30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(75, 12)">
    <!-- Sub-heading top -->
    <text x="0" y="14" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="12" font-weight="700" fill="#F5F5F5" letter-spacing="3">THẠCH CAO</text>
    
    <!-- Main Brand Name -->
    <text x="0" y="38" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="25" font-weight="900" fill="url(#goldGrad)" letter-spacing="1">NGUYÊN VŨ</text>
    
    <!-- Tagline -->
    <text x="0" y="52" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" fill="#E0E0E0" letter-spacing="1.5">THI CÔNG &amp; VẬT TƯ TRỌN GÓI</text>
  </g>
</svg>
